severity: High
category: "Stealth"
action: Detect
action_description: >
  Detecta la manipulación del fichero de historial de shell (~/.bash_history y
  equivalentes) para borrar rastro de comandos: borrado (rm), vaciado (echo/cat
  /dev/null), truncado (truncate) o redirección a /dev/null (symlink). Basada en
  los tests Atomic Red Team T1070.003 #1-#5.
scope: site
status: Draft
expiration: Permanent
tags:
  - defense-evasion
  - linux
  - clear-history
  - bash-history
  - anti-forensics
notes:
  - >
    Cubre las cinco variantes de manipulación del fichero (#1-#5): rm, "echo '' >",
    "cat /dev/null >", "ln -sf /dev/null" y "truncate -s0", todas apuntando a un
    fichero de historial (.bash_history, .zsh_history, .sh_history, etc.). La firma
    común es el nombre del fichero de historial en la cmdline junto a un binario de
    borrado/vaciado/truncado.
  - >
    Doble ángulo: (1) por comando (esta regla) — binario de manipulación +
    "history" en la ruta; (2) por evento de fichero (regla hermana, más robusta) —
    File Deletion/Modification sobre *.bash_history, que caza también el vaciado
    por redirección del shell (echo "" > file) que no crea un proceso propio.
  - >
    IMPORTANTE sobre redirecciones (#2, #3): "echo '' > ~/.bash_history" y "cat
    /dev/null > ~/.bash_history" — la redirección ">" la ejecuta el SHELL, no echo/
    cat. Según cómo capture el tenant la cmdline, el ">" y la ruta destino pueden
    aparecer en la cmdline del proceso echo/cat o en la del shell padre. La regla
    busca la ruta de historial en la cmdline en general; verificar que se captura.
    El ángulo de fichero (regla hermana) es más fiable para estos dos.
  - >
    Falsos positivos: bajos pero existen (un usuario que limpia su propio historial,
    scripts de limpieza). Un borrado/truncado de .bash_history de OTRO usuario, o
    desde una sesión sospechosa, es la señal fuerte. Validar en Detect.
  - >
    Verificar campos Linux: tgt.process.name, tgt.process.cmdline, endpoint.os
    ('linux' vs 'Linux'). Confirmar con un columns en Event Search.
query: |
  event.type = 'Process Creation' 
  and endpoint.os = 'linux' 
  and tgt.process.name in ('rm', 'truncate', 'ln', 'shred', 'unlink') 
  and tgt.process.cmdline matches '(?i).*(bash_history|zsh_history|sh_history|\.history|HISTFILE).*'