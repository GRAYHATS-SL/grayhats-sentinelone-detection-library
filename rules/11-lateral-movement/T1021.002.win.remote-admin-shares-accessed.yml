name: "Lateral Movement - Remote Admin Shares Accessed"
author: "GrayHats Detection Team"
license: "AGPL-3.0-or-later"
os: windows
mitre:
  tactic: "Lateral Movement"
  techniques:
    - id: T1021.002
      name: "Remote Services: SMB/Windows Admin Shares"
severity: High
category: "Lateral Movement"
action: Detect
action_description: >
  Se ha detectado un acceso a Admin Share remoto desde este equipo. Posible
  indicio de movimiento lateral.
scope: site
status: Draft
expiration: Permanent
tags:
  - lateral-movement
notes:
  - >
    Cubre el acceso a Admin Shares de equipos remotos desde un equipo comprometido.
  - >
    Cubre los Admin Shares C$ y ADMIN$.  
art_test: true 
tests_included: [1, 2, 4]
test_guids:
  - "3386975b-367a-4fbb-9d77-4dcf3639ffd3"   # Test 1: Map admin share
  - "514e9cd7-9207-4882-98b1-c8f791bae3c5"   # Test 2: Map Admin Share PowerShell
  - "d41aaab5-bdfe-431d-a3d5-c29e9136ff46"   # Test 3: Execute command writing output to local Admin Share
coverage: full
validation_status: validated
last_validated: "2026-10-14"
query: |
  event.type = 'Process Creation'
  AND endpoint.os = 'windows' 
  AND tgt.process.cmdline contains:anycase ('\C$', '\ADMIN$')